<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repack">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Repack Ledger</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#0b1324;--ink2:#334155;--mute:#6b7280;--line:#e6e8ec;--acc:#0d9488;--acc-ink:#fff;--acc-soft:#d5f5ef;--acc-soft-ink:#0f5f57;--neg:#dc2626;--pos:#059669;--chip:#eceef2;--warn:#fef3c7;--warn-ink:#92400e;--o0:#e8ebff;--o0-ink:#4338ca;--o1:#ffeedd;--o1-ink:#c2410c;--os:#eceef2;--os-ink:#475569;--sold:#dcfce7;--sold-ink:#166534;--trade:#f3e8ff;--trade-ink:#7e22ce;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.05);--hero1:#0f766e;--hero2:#123f3b;--acc2:#dbeafe;--acc2-ink:#1d4ed8;--rej:#fee2e2;--rej-ink:#b91c1c;--glass:rgba(244,245,247,.86);--navglass:rgba(255,255,255,.9)}
@media(prefers-color-scheme:dark){:root{--bg:#090e18;--card:#111a2a;--ink:#e8ecf3;--ink2:#cbd5e1;--mute:#93a0b4;--line:#1d283b;--acc:#2dd4bf;--acc-ink:#03211f;--acc-soft:#0e2f2c;--acc-soft-ink:#5eead4;--neg:#f87171;--pos:#34d399;--chip:#1a2436;--warn:#382707;--warn-ink:#fcd34d;--o0:#1f1d4a;--o0-ink:#a5b4fc;--o1:#3a1e0c;--o1-ink:#fdba74;--os:#1a2436;--os-ink:#b6c2d4;--sold:#0f2e1c;--sold-ink:#86efac;--trade:#2a1640;--trade-ink:#d8b4fe;--shadow:none;--hero1:#0f5f58;--hero2:#0a2724;--acc2:#13264a;--acc2-ink:#93c5fd;--rej:#3b1414;--rej-ink:#fca5a5;--glass:rgba(9,14,24,.86);--navglass:rgba(17,26,42,.92)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
b,.num{font-variant-numeric:tabular-nums}
.ic{flex:0 0 auto;display:block}
#app{max-width:720px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);z-index:5}
header .hl{display:flex;align-items:center;gap:10px;min-width:0}
header .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto}
header .ht{min-width:0}
header h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
header p{margin:0;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:99px;border:0;background:var(--acc-soft);color:var(--acc-soft-ink);font-weight:700;font-size:15px;cursor:pointer;flex:0 0 auto}
.icon{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;width:36px;height:36px;padding:0;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
main{padding:2px 16px 0}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;min-height:46px;cursor:pointer;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--neg);border:1.5px solid var(--neg)}
.btn.dangerf{background:var(--neg);color:#fff}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn.block{width:100%;display:flex}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:18px;padding:16px 16px 14px;margin:4px 0 14px;box-shadow:0 8px 24px -12px rgba(15,118,110,.55)}
.hero span,.hero .lbl{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.75;font-weight:600}
.hero .big{display:block;font-size:31px;font-weight:750;letter-spacing:-.02em;margin-top:2px;line-height:1.15}
.hero small{display:block;opacity:.7;font-size:12.5px;margin-top:2px}
.hero .big.neg{color:#fecaca}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16)}
.hstats>div{min-width:0;padding-right:8px}
.hstats>div+div{padding-left:12px;border-left:1px solid rgba(255,255,255,.16)}
.hstats b{display:block;font-size:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.quick.q2{grid-template-columns:1fr 1fr}
.qbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 4px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;box-shadow:var(--shadow);min-height:62px}
.qbtn .ic{color:var(--acc)}
.qbtn:active{transform:scale(.98)}
.qbtn.dz{color:var(--neg)}.qbtn.dz .ic{color:var(--neg)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.tile span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile b{font-size:19px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.t3 .tile b{font-size:16px}
.tile small{color:var(--mute);font-size:12px;margin-top:3px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.toolbar .btn{flex:1 1 auto}
.searchw{position:relative;margin-bottom:8px}
.searchw .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search{width:100%;padding:11px 12px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.chips{display:flex;gap:6px;margin:8px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--chip);border:0;border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--ink2)}
.chip i{font-style:normal;opacity:.6;margin-left:4px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
select.mini{padding:8px 10px;font-size:14px;border-radius:10px;background:var(--card);font-weight:500;color:var(--ink2)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s}
.row:active{transform:scale(.99)}
.row.static{cursor:default}.row.static:active{transform:none}
.row.picked{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.row.dim{opacity:.5}
.row .main{min-width:0;flex:1}
.row .desc{font-weight:600;font-size:15px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.row .desc.one{-webkit-line-clamp:1}
.row .sub{color:var(--mute);font-size:12.5px;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.row .amt{text-align:right;align-self:flex-start;padding-top:1px;max-width:34%;flex:0 0 auto}
.row .sub.one{display:block;white-space:nowrap;text-overflow:ellipsis}
.row .amt b{font-size:15px;display:block;white-space:nowrap}
.row .amt small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{display:inline-flex;align-items:center;font-size:11px;line-height:1;padding:4px 8px;border-radius:99px;background:var(--warn);color:var(--warn-ink);font-weight:650;white-space:nowrap}
.badge.ok{background:var(--chip);color:var(--ink2)}
.badge.o0{background:var(--o0);color:var(--o0-ink)}
.badge.o1{background:var(--o1);color:var(--o1-ink)}
.badge.os{background:var(--os);color:var(--os-ink)}
.badge.sold{background:var(--sold);color:var(--sold-ink)}
.badge.trade{background:var(--trade);color:var(--trade-ink)}
.badge.rp-pending{background:var(--warn);color:var(--warn-ink)}
.badge.rp-accepted{background:var(--acc2,#dbeafe);color:var(--acc2-ink,#1d4ed8)}
.badge.rp-rejected{background:var(--rej,#fee2e2);color:var(--rej-ink,#b91c1c)}
.badge.age{background:transparent;color:var(--mute);border:1px solid var(--line);padding:3px 7px}
.badge.age.old{background:var(--warn);color:var(--warn-ink);border-color:transparent}
.thumbsm{width:42px;height:42px;border-radius:11px;background:var(--chip);flex:0 0 auto;display:grid;place-items:center;overflow:hidden;color:var(--mute);align-self:flex-start}
.thumbsm img{width:100%;height:100%;object-fit:cover;display:block}
.thumbsm img:not([src]){display:none}
.thumbsm.o0{background:var(--o0);color:var(--o0-ink)}.thumbsm.o1{background:var(--o1);color:var(--o1-ink)}
.thumbsm.ent{width:40px;height:40px;border-radius:99px;align-self:center}
.thumbsm.ent.pay{background:var(--sold);color:var(--sold-ink)}
.selc{width:24px;height:24px;border-radius:99px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;color:#fff}
.selc.on{background:var(--acc);border-color:var(--acc)}
.kebab{width:34px;height:34px;border-radius:99px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;margin:-4px -6px -4px 0}
.kebab:active{background:var(--chip)}
.sech{display:flex;justify-content:space-between;align-items:center;margin:20px 0 9px;gap:8px}
.sech h3{margin:0;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.dayh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 2px 8px}
.empty{color:var(--mute);text-align:center;padding:26px 16px;border:1.5px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14.5px}
.empty p{margin:0}
.cardbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.cardbox h3{margin:0 0 4px;font-size:16px}
.cardbox .hint{margin:0 0 12px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px;box-shadow:var(--shadow)}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-weight:600}
th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
tr:last-child td{border-bottom:0}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow);min-width:0}
.pcard .pn{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.pcard .dot{width:9px;height:9px;border-radius:99px;background:var(--o0-ink)}
.pcard .dot.o1{background:var(--o1-ink)}
.pcard .lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-top:10px;font-weight:600}
.pcard .big{display:block;font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard small{display:block;color:var(--mute);font-size:12px;margin-top:6px}
.prog{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.banner{margin:0 16px 10px;background:var(--warn);color:var(--warn-ink);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner span{font-size:14px;font-weight:500}
.selhint{font-size:13px;color:var(--acc-soft-ink);background:var(--acc-soft);border-radius:12px;padding:9px 12px;margin:0 0 10px;font-weight:500}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navglass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;max-width:140px;background:none;border:0;padding:4px 2px 8px;font-size:11px;color:var(--mute);cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav .nb{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background .15s}
nav button.on{color:var(--ink)}
nav button.on .nb{background:var(--acc-soft);color:var(--acc-soft-ink)}
.overlay{position:fixed;inset:0;background:rgba(3,7,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 10px;font-size:19px;letter-spacing:-.01em}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.menu{display:flex;flex-direction:column;background:var(--bg);border-radius:14px;overflow:hidden;margin:12px 0 4px}
.mi{display:flex;align-items:center;gap:12px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px;font-size:16px;font-weight:500;text-align:left;cursor:pointer;color:var(--ink)}
.mi:last-child{border-bottom:0}
.mi .ic{color:var(--mute)}
.mi.dz{color:var(--neg)}.mi.dz .ic{color:var(--neg)}
.mi:active{background:var(--chip)}
.dzic{width:52px;height:52px;border-radius:99px;background:#fee2e2;color:#b91c1c;display:grid;place-items:center;margin:4px auto 10px}
@media(prefers-color-scheme:dark){.dzic{background:#3b1414;color:#fca5a5}}
.center{text-align:center}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.counts div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.counts b{display:block;font-size:20px}
.counts span{font-size:12px;color:var(--mute)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;font-weight:500}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
input[type=checkbox]{width:auto;transform:scale(1.3);margin-right:10px;accent-color:var(--acc);box-shadow:none}
.chk{display:flex;align-items:center;color:var(--ink);font-size:15px;margin:14px 0 4px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>div{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:9px;padding:9px 2px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.seg button.on[data-v=accepted]{background:var(--acc2-ink);color:var(--card)}
.seg button.on[data-v=rejected]{background:var(--neg);color:var(--card)}
.seg button.on[data-v=pending]{background:var(--warn-ink);color:var(--warn)}
.seghint{font-size:12.5px;color:var(--mute);margin:6px 2px 0;min-height:1em}
.hidesel{display:none!important}
.btn.ico{flex:0 0 auto!important;width:48px;padding:0}
.btn.ico.danger{border-width:1.5px}
.scanopts{display:flex;align-items:center;justify-content:space-between;gap:8px}
.overlay.fullscan{align-items:stretch;background:#000;animation:none}
.sheet.fullscan{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;padding:0;background:#000;position:relative;overflow:hidden;animation:fade .15s}
.sheet.fullscan>.grab{display:none}
.fs-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fs-guide{position:absolute;left:13%;right:13%;top:18%;height:27%;border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.32);transition:border-color .15s,transform .15s;pointer-events:none}
.fs-guide.hit{border-color:#22c55e;transform:scale(1.03)}
.fs-guide span{position:absolute;left:0;right:0;bottom:-34px;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.fs-tap{position:absolute;inset:0;z-index:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.camtap{position:absolute;inset:0;z-index:1;cursor:pointer}
.camwrap .shutter{z-index:2}
.shutterfx{position:absolute;inset:0;background:#fff;opacity:.75;z-index:6;pointer-events:none;animation:shut .35s ease-out forwards}
@keyframes shut{to{opacity:0}}
.fs-msg{position:absolute;left:24px;right:24px;top:22%;color:#fff;text-align:center;z-index:2}
.fs-msg p{margin:0 0 12px;font-size:15px}
.fs-top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;color:#fff;z-index:4}
.fs-top h2{flex:1;margin:0;font-size:17px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.fs-ib{width:40px;height:40px;border-radius:99px;border:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.fs-chip{border:0;background:rgba(0,0,0,.5);color:#fff;border-radius:99px;padding:10px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.fs-extra{position:absolute;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top));z-index:5;background:var(--card);color:var(--ink);border-radius:18px;padding:4px 14px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#sctype{padding-top:14px}
.fs-flash{position:absolute;left:50%;top:calc(45% + 44px);transform:translateX(-50%);background:rgba(17,24,39,.85);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;z-index:3;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.fs-flash.show{opacity:1}.fs-flash.ok{background:#16a34a}.fs-flash.warn{background:#b45309}

<body>

<script src="config.js"></script>

<script>
"use strict";
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const CFG_KEY="repack-cfg",CACHE_KEY="repack-cache-v1";

const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>{n=round2(n||0);return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})};
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const parseISO=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const fmtDate=iso=>{if(!iso)return "";const [y,m,d]=String(iso).slice(0,10).split("-");return +m+"/"+ +d+"/"+y};
const fmtTime=iso=>{if(!iso)return "";const d=new Date(iso);return fmtDate(isoOf(d))+" "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})};
const sum=(a,f)=>round2(a.reduce((t,x)=>t+(+f(x)||0),0));

let sb=null,state=null,me=null,rt=null,rtT=null;
let UIP={};try{UIP=JSON.parse(localStorage.getItem("repack-ui"))||{}}catch(e){}
let ui={sort:UIP.sort||"new",owner:"",sel:null,tab:"cards",q:"",filter:"all",hist:null,actUser:"",offline:false,dirty:false,recovery:false,denied:""};

// ---------- config ----------
function cfg(){
  const c=window.REPACK_CONFIG||{};
  const okUrl=u=>/^https?:\/\/[^\s]+\.[^\s]+/i.test(String(u||"").trim());
  if(okUrl(c.supabaseUrl)&&c.supabaseAnonKey)return{url:String(c.supabaseUrl).trim(),key:String(c.supabaseAnonKey).trim()};
  try{const l=JSON.parse(localStorage.getItem(CFG_KEY));if(l&&okUrl(l.url)&&l.key)return{url:l.url.trim(),key:String(l.key).trim()};if(l)localStorage.removeItem(CFG_KEY)}catch(e){}
  return null;
}

// ---------- row mapping ----------
const num=v=>v==null?"":+v;
const mapCard=r=>({id:r.id,date:r.date_purchased||"",cert:r.cert||"",desc:r.description||"",owner:r.owner,mv:num(r.market_value),pct:+r.consignor_pct,sold:!!r.sold,soldPrice:num(r.sold_price),soldDate:r.sold_date||"",splitDone:!!r.split_done,saleType:r.sale_type||(r.sold?"sold":""),tradeCash:num(r.trade_cash),fromCardId:r.from_card_id||null,carried:!!r.carried,cost:num(r.cost),spendId:r.spend_id||null,repack:r.repack_status||(r.notes==="Pending Triumph approval"?"pending":""),repacker:r.repacker||(r.repack_status||r.notes==="Pending Triumph approval"?"Triumph":""),repackDate:r.repack_date||"",notes:r.notes||"",createdBy:r.created_by,createdAt:r.created_at,updatedBy:r.updated_by,updatedAt:r.updated_at});
const mapEntry=r=>({id:r.id,partner:r.partner,amount:+r.amount,kind:r.kind||"buy",to:r.to_partner||"",date:r.entry_date||"",note:r.note||"",cardId:r.card_id,createdBy:r.created_by,createdAt:r.created_at,updatedBy:r.updated_by,updatedAt:r.updated_at});
const cardRow=r=>{const o=cardRow0(r);if(state&&state.hasRepack){o.repack_status=r.repack||null;o.repack_date=r.repack?(r.repackDate||todayISO()):null}if(state&&state.hasRepacker)o.repacker=r.repack?(r.repacker||state.settings.repackers[0]):null;if(state&&state.hasCost){o.cost=(r.cost===""||r.cost==null)?null:+r.cost;o.spend_id=r.spendId||null}return o};
const cardRow0=r=>({date_purchased:r.date||null,cert:r.cert||null,description:r.desc||"",owner:r.owner,market_value:r.mv===""?null:+r.mv,consignor_pct:+r.pct,sold:!!r.sold,sale_type:r.sold?(r.saleType||"sold"):null,sold_price:(r.soldPrice===""||r.soldPrice==null)?null:+r.soldPrice,sold_date:r.soldDate||null,trade_cash:(r.sold&&r.saleType==="traded"&&r.tradeCash!==""&&r.tradeCash!=null)?+r.tradeCash:null,notes:r.notes||""});

async function fetchAll(table,order){
  let out=[],from=0;
  for(;;){
    const {data,error}=await sb.from(table).select("*").order(order||"seq",{ascending:true}).range(from,from+999);
    if(error)throw error;
    out=out.concat(data);
    if(data.length<1000)break;
    from+=1000;
  }
  return out;
}
async function loadAll(){
  const [st,wk,cd,sp,po,at,au,mb,rp,rq,lq]=await Promise.all([
    sb.from("settings").select("*").eq("id",1).single(),
    sb.from("weeks").select("*").order("start_date",{ascending:true}),
    fetchAll("cards"),fetchAll("spend"),fetchAll("payouts"),fetchAll("attachments","created_at"),
    sb.from("audit").select("*").order("id",{ascending:false}).limit(300),
    sb.from("members").select("*"),
    sb.from("cards").select("repack_status").limit(1),
    sb.from("cards").select("repacker").limit(1),
    sb.from("spend").select("kind").limit(1)
  ]);
  for(const r of [st,wk,au])if(r.error)throw r.error;
  const by=(rows,map)=>{const m=new Map();rows.forEach(r=>{if(!m.has(r.week_id))m.set(r.week_id,[]);m.get(r.week_id).push(map(r))});return m};
  const cm=by(cd,mapCard),sm=by(sp,mapEntry),pm=by(po,mapEntry);
  const mk=w=>({id:w.id,label:w.label,start:w.start_date,end:w.end_date,cards:cm.get(w.id)||[],spend:sm.get(w.id)||[],payouts:pm.get(w.id)||[]});
  const open=wk.data.find(w=>!w.closed);
  if(!open)throw new Error("No open week found. Re-run setup.sql.");
  const history=wk.data.filter(w=>w.closed).sort((a,b)=>(b.end_date||"").localeCompare(a.end_date||"")||b.start_date.localeCompare(a.start_date)).map(mk);
  const attach=new Map();at.forEach(a=>{const k=a.card_id||a.spend_id||a.payout_id;if(!attach.has(k))attach.set(k,[]);attach.get(k).push({id:a.id,path:a.path,caption:a.caption})});
  state={hasCost:false,hasLoan:!!(lq&&!lq.error),hasRepack:!!(rp&&!rp.error),hasRepacker:!!(rq&&!rq.error),hasRepackerList:!!(st.data&&"repackers" in st.data),members:(mb&&!mb.error&&mb.data)||[],attach,settings:{partners:st.data.partners,resetDay:st.data.reset_day,defaultPct:+st.data.default_pct,repackers:(Array.isArray(st.data.repackers)&&st.data.repackers.length?st.data.repackers:["Triumph","LastPack"])},week:mk(open),history,audit:au.data};
  ui.offline=false;
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({me,state}))}catch(e){}
}
async function refreshRender(){try{await loadAll()}catch(e){toast(errText(e))}render()}
async function softRefresh(){
  try{await loadAll()}catch(e){return}
  if(document.querySelector(".overlay")){ui.dirty=true;return}
  const a=document.activeElement;
  if(a&&a.id==="q"&&$("#cardlist")){paintList();return}
  render();
}
function errText(e){
  const m=String((e&&e.message)||e||"");
  if(e&&e.code==="23505")return "That cert number is already in this week";
  if(/fetch|network|Failed to/i.test(m))return "No connection. Try again when you are online.";
  if(e&&e.code==="42501")return "You do not have access. Is your email on the members list?";
  return m||"Something went wrong";
}
async function api(p){
  let r;
  try{r=await p}catch(e){toast(errText(e));return null}
  if(r&&r.error){toast(errText(r.error));return null}
  return r||{};
}

// ---------- realtime ----------
const APP_VERSION=29;
let pc=null,rtStatus="",pcStatus="",rtErr="",pcErr="",retryT=null;
function subscribe(){
  if(!sb||!me)return;
  if(!rt){
    rt=sb.channel("repack-live")
      .on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(rtT);rtT=setTimeout(softRefresh,400)})
      .subscribe((st,err)=>{rtStatus=st;rtErr=err?String(err.message||err):"";if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")retryLive()});
  }
  if(!pc){
    pc=sb.channel("repack-presence",{config:{presence:{key:me.name}}})
      .on("presence",{event:"sync"},()=>{try{online=pc.presenceState()||{}}catch(e){online={}}paintPresence()})
      .subscribe((st,err)=>{pcStatus=st;pcErr=err?String(err.message||err):"";if(st==="SUBSCRIBED")trackMe(true);else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")retryLive()});
  }
}
function retryLive(){
  clearTimeout(retryT);
  retryT=setTimeout(()=>{if(!me||!sb)return;
    if(rt&&rtStatus!=="SUBSCRIBED"){try{sb.removeChannel(rt)}catch(e){}rt=null}
    if(pc&&pcStatus!=="SUBSCRIBED"){try{sb.removeChannel(pc)}catch(e){}pc=null;online={};lastTrack=""}
    subscribe();
  },5000);
}
function liveText(){
  if(rtStatus==="SUBSCRIBED"&&pcStatus==="SUBSCRIBED")return "Connected";
  const bad=[rtStatus&&rtStatus!=="SUBSCRIBED"?"data "+rtStatus.toLowerCase().replace("_"," ")+(rtErr?" ("+rtErr+")":""):"",pcStatus&&pcStatus!=="SUBSCRIBED"?"online list "+pcStatus.toLowerCase().replace("_"," ")+(pcErr?" ("+pcErr+")":""):""].filter(Boolean);
  return bad.length?"Not connected: "+bad.join(", "):"Connecting...";
}
function teardown(){
  clearTimeout(rtT);
  clearTimeout(retryT);
  if(rt&&sb){try{sb.removeChannel(rt)}catch(e){}}
  if(pc&&sb){try{sb.removeChannel(pc)}catch(e){}}
  rt=null;pc=null;me=null;state=null;online={};lastTrack="";rtStatus=pcStatus=rtErr=pcErr="";
  try{localStorage.removeItem(CACHE_KEY)}catch(e){}
}

// ---------- calc ----------
// each slab's cost: a cost typed on the slab wins; otherwise its share of the buy (lot) it is linked to, split by market value
const hasOwnCost=c=>c.cost!==""&&c.cost!=null;
function lotCosts(w){
  const out=new Map();
  w.spend.forEach(b=>{
    const inLot=w.cards.filter(c=>c.spendId===b.id);if(!inLot.length)return;
    const open=inLot.filter(c=>!hasOwnCost(c));if(!open.length)return;
    const rest=Math.max(0,(+b.amount||0)-sum(inLot.filter(hasOwnCost),c=>c.cost)),mvs=sum(open,c=>c.mv);
    let left=round2(rest);open.forEach((c,i)=>{const v=i===open.length-1?left:round2(mvs>0?rest*(+c.mv||0)/mvs:rest/open.length);out.set(c.id,v);left=round2(left-v)});
  });
  w.cards.forEach(c=>{if(hasOwnCost(c))out.set(c.id,+c.cost)});
  return out;
}
const lcCache=new WeakMap();
const lotCostsOf=w=>{let m=lcCache.get(w);if(!m){m=lotCosts(w);lcCache.set(w,m)}return m};
const payoutOf=c=>Math.round((+c.mv||0)*(+c.pct||0))/100;
const cashIn=c=>c.saleType==="traded"?(+c.tradeCash||0):(+c.soldPrice||0);
function calc(w){
  const stock=w.cards.filter(c=>!c.sold&&!c.carried),sold=w.cards.filter(c=>c.sold),carriedN=w.cards.filter(c=>!c.sold&&c.carried).length;
  const mv=sum(stock,c=>c.mv),due=sum(stock,payoutOf),proceeds=sum(sold,cashIn);
  const spent=sum(w.spend.filter(x=>x.kind!=="loan"),x=>x.amount),paid=sum(w.payouts,x=>x.amount);
  const so=sold.filter(c=>c.saleType!=="traded"&&+c.mv>0&&c.soldPrice!==""&&c.soldPrice!=null),smv=sum(so,c=>c.mv),ssp=sum(so,c=>c.soldPrice);
  const acc=stock.filter(c=>c.repack==="accepted"),pend=stock.filter(c=>c.repack==="pending"),accBy={};
  acc.forEach(c=>{const n=c.repacker||"Repacker";accBy[n]=round2((accBy[n]||0)+payoutOf(c))});
  return{soldProfit:round2(proceeds+sum(acc,payoutOf)-spent),unsoldProfit:round2(due-spent),carriedN,accBy,accN:acc.length,accDue:sum(acc,payoutOf),pendN:pend.length,pendDue:sum(pend,payoutOf),soldPct:smv>0?ssp/smv*100:null,stockN:stock.length-acc.length-pend.length,soldN:sold.length,tradedN:sold.filter(c=>c.saleType==="traded").length,mv,due,proceeds,spent,paid,profit:round2(due+proceeds-spent),rate:mv>0?spent/mv*100:null};
}
// each partner gets back what they spent plus an equal share of the profit; payouts already made come off that
function pcalc(w,p){
  // a loan between partners moves money from one to the other without counting as spend
  const spent=round2(sum(w.spend.filter(x=>x.partner===p),x=>x.amount)-sum(w.spend.filter(x=>x.kind==="loan"&&x.to===p),x=>x.amount));
  const paid=sum(w.payouts.filter(x=>x.partner===p),x=>x.amount);
  // still owed = what they spent + half the profit from what has sold - what they have already been paid
  const share=round2(calc(w).soldProfit/Math.max(1,state.settings.partners.length));
  return{spent,paid,share,left:round2(spent+share-paid)};
}
const cardLabel=c=>(c.desc||"(no description)")+(c.cert?" | cert "+c.cert:"");
const whoText=o=>{if(!o||!o.createdBy)return "";let s="Added by "+o.createdBy+" on "+fmtTime(o.createdAt);if(o.updatedAt&&o.updatedAt!==o.createdAt)s+=" | Last edited by "+o.updatedBy+" on "+fmtTime(o.updatedAt);return esc(s)};

const csvCell=v=>{if(typeof v==="string"&&/^[=+@\t\r]/.test(v))v="'"+v;v=String(v==null?"":v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>"﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
function parseCSV(t){
  const rows=[];let r=[],f="",q=false;t=t.replace(/^﻿/,"");
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);rows.push(r);r=[];f=""}
    else f+=c}
  if(f!==""||r.length){r.push(f);rows.push(r)}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
const parseMoney=v=>{const n=parseFloat(String(v==null?"":v).replace(/[$,\s%]/g,""));return isFinite(n)?n:0};
function parseDate(v){v=String(v||"").trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(m[1])+"-"+pad(m[2])}return ""}

async function exportFile(name,text,mime){
  mime=mime||"text/csv";
  const blob=new Blob([text],{type:mime});
  try{
    const file=new File([blob],name,{type:mime});
    if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==="AbortError")return}
    }
  }catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

const CARD_HEAD=["Week","Date Purchased","PSA Cert #","Item Description","Owner","Market Value","Consignor %","Consignor Payout","Status","Repacker","Repacker Status","Sold Price / Trade Value","Cash Received","% of Market","Received In Trade For (Cert)","Sold Date","Notes","Photos","Added By","Added At","Last Edited By","Last Edited At"];
const cardRows=(w,label)=>{const byId=new Map(w.cards.map(c=>[c.id,c]));return w.cards.map(c=>{const st=c.sold?(c.saleType==="traded"?"Traded":"Sold"):"In stock";const from=c.fromCardId&&byId.get(c.fromCardId);return [label,fmtDate(c.date),c.cert,c.desc,c.owner,round2(+c.mv||0),+c.pct||0,round2(payoutOf(c)),st,c.repack?c.repacker:"",c.repack?({pending:"Pending",accepted:"Accepted",rejected:"Rejected"})[c.repack]:"",c.sold?round2(+c.soldPrice||0):"",c.sold?round2(cashIn(c)):"",c.sold&&+c.mv>0&&c.soldPrice!==""&&c.soldPrice!=null?round2(+c.soldPrice/+c.mv*100):"",from?from.cert:"",c.sold?fmtDate(c.soldDate):"",c.notes||"",attachN(c.id),...stampCols(c)]})};
const MONEY_HEAD=["Week","Type","Partner","Amount","Date","Note","Added By","Added At","Last Edited By","Last Edited At"];
const moneyRows=(w,label)=>[...w.spend.map(x=>[label,x.kind==="loan"?"Loan":"Spend",x.kind==="loan"?x.partner+" to "+x.to:x.partner,round2(+x.amount||0),fmtDate(x.date),x.note||"",...stampCols(x)]),...w.payouts.map(x=>[label,"Payout",x.partner,round2(+x.amount||0),fmtDate(x.date),x.note||"",...stampCols(x)])];
function summaryRows(w,label){
  const t=calc(w);
  const rows=[["Week",label],["Cards in stock",t.stockN],["Cards sold to customers",t.soldN],["Accepted by repackers",t.accN],["Accepted payout (repackers owe)",t.accDue],...Object.entries(t.accBy).map(([n,v])=>[n+" owes",v]),["Pending at repackers",t.pendN],["Total market value",t.mv],["Total consignor payout",t.due],["Sold proceeds",t.proceeds],["Total spent",t.spent],["Total paid out",t.paid],["Expected profit, all slabs (sales + unsold at payout - spent)",t.profit],["Rate (spent / market value %)",t.rate==null?"":round2(t.rate)],["Average sold % of market",t.soldPct==null?"":round2(t.soldPct)],["Sold profit (sales + accepted by repackers - spent)",t.soldProfit],["Expected profit, unsold slabs only (unsold at payout - spent)",t.unsoldProfit],[],["Partner","Spent","Half of sold profit","Paid out","Still owed"]];
  state.settings.partners.forEach(p=>{const c=pcalc(w,p);rows.push([p,c.spent,c.share,c.paid,c.left])});
  return rows;
}

let toastT;
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200)}
function modal(html){closeModal();const o=document.createElement("div");o.className="overlay";o.innerHTML='<div class="sheet" role="dialog"><div class="grab"></div>'+html+"</div>";o.addEventListener("mousedown",e=>{if(e.target===o)closeModal()});document.body.appendChild(o);swipeClose(o,o.firstChild);document.body.classList.add("noscroll");return o.firstChild}
function swipeClose(o,sh){
  let y0=null,x0=0,dy=0,t0=0,drag=false;
  sh.addEventListener("touchstart",e=>{if(sh.classList.contains("fullscan")||e.touches.length!==1||sh.scrollTop>0||e.target.closest("video,.chips,input[type=range]")){y0=null;return}y0=e.touches[0].clientY;x0=e.touches[0].clientX;t0=Date.now();dy=0;drag=false},{passive:true});
  sh.addEventListener("touchmove",e=>{
    if(y0==null)return;const t=e.touches[0],d=t.clientY-y0;
    if(!drag){if(d>8&&Math.abs(d)>Math.abs(t.clientX-x0)&&sh.scrollTop<=0){drag=true;y0=t.clientY;t0=Date.now();sh.style.transition="none";sh.style.animation="none";const a=document.activeElement;if(a&&a.blur&&sh.contains(a))a.blur()}else if(d<-4||Math.abs(t.clientX-x0)>12){y0=null}return}
    dy=Math.max(0,t.clientY-y0);e.preventDefault();
    sh.style.transform="translateY("+dy+"px)";o.style.background="rgba(3,7,18,"+(0.45*(1-Math.min(1,dy/500))).toFixed(3)+")";
  },{passive:false});
  const end=()=>{if(y0==null)return;y0=null;if(!drag)return;drag=false;
    const v=dy/Math.max(1,Date.now()-t0);sh.style.transition="transform .2s ease";
    if(dy>110||(v>0.5&&dy>30)){sh.style.transform="translateY(110%)";o.style.transition="background .2s";o.style.background="rgba(3,7,18,0)";setTimeout(()=>{if(o.isConnected)closeModal()},190)}
    else{sh.style.transform="";o.style.background=""}};
  sh.addEventListener("touchend",end);sh.addEventListener("touchcancel",end);
}
function closeModal(){stopCamera();document.querySelectorAll(".overlay").forEach(o=>o.remove());document.body.classList.remove("noscroll");if(ui.dirty){ui.dirty=false;softRefresh()}}

}
function renderLogin(){
  if(ui.denied){
    $("#app").innerHTML='<div class="welcome"><h1>No access</h1><p class="hint">'+esc(ui.denied)+' is signed in but is not on the members list. Ask Alex to add this email, then sign in again.</p><button class="btn block" data-act="sign-out">Sign out</button></div>';return;

  const f=$("#lf");

    e.preventDefault();busy(f,true);
    const {data,error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pw.value}).catch(x=>({error:x}));
    if(error||!data||!data.session){busy(f,false);toast(error&&/invalid/i.test(error.message)?"Wrong email or password":errText(error));return}

function renderNewPassword(){
  $("#app").innerHTML='<div class="welcome"><h1>Set a new password</h1><form id="nf"><input name="p1" type="password" autocomplete="new-password" minlength="8" placeholder="New password (8+ characters)" required><input name="p2" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm password" style="margin-top:8px" required><button class="btn block" style="margin-top:12px" type="submit">Save password</button></form></div>';
  $("#nf").addEventListener("submit",async e=>{
    e.preventDefault();const f=e.target;
    if(f.p1.value!==f.p2.value){toast("Passwords do not match");return}
    const r=await api(sb.auth.updateUser({password:f.p1.value}));if(!r)return;
    ui.recovery=false;toast("Password saved");
    const {data}=await sb.auth.getSession();if(data.session)await enter(data.session);else render();
  });
}
async function enter(session){
  try{
    const email=(session.user.email||"").toLowerCase();
    const m=await sb.from("members").select("name").eq("email",email).maybeSingle();
    if(m.error)throw m.error;
    if(!m.data){ui.denied=email;me=null;render();return}
    ui.denied="";me={name:m.data.name,email};
    await loadAll();subscribe();render();
  }catch(e){
    // offline fallback: show the last saved copy read-only
    try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));if(c&&c.state&&c.me&&c.me.email===(session.user.email||"").toLowerCase()){me=c.me;state=c.state;ui.offline=true;render();return}}catch(x){}
    toast(errText(e));
    me=null;render();
  }
}

async function deleteWeek(id){
  const hw=state.history.find(h=>h.id===id);
  const local=photoPaths(hw?[...hw.cards,...hw.spend,...hw.payouts].map(x=>x.id):[]);
  let r;
  try{r=await sb.rpc("delete_week",{p_id:id})}catch(e){toast(errText(e));return false}
  if(r&&r.error){
    const e=r.error,m=String(e.message||"");
    if(e.code==="PGRST202"||e.code==="42883"||(/delete_week/i.test(m)&&/find|exist/i.test(m))){
      if(!await api(sb.from("weeks").delete().eq("id",id)))return false;
      removeFiles(local);return true;
    }
    toast(errText(e));return false;
  }
  removeFiles([...new Set([...((r&&Array.isArray(r.data))?r.data:[]),...local])]);
  return true;
}

// ---------- scanning ----------
let camStop=null;
function stopCamera(){if(camStop){try{camStop()}catch(e){}camStop=null}}
function normalizeCert(raw){
  const s=String(raw||"").trim();
  let m=s.match(/cert\/(\d{5,10})/i);if(m)return m[1];
  m=s.match(/^\D*(\d{6,10})\D*$/);if(m)return m[1];
  const t=s.replace(/[\s-]/g,"");if(/^\d{5,10}$/.test(t))return t;
  return s;
}
function beep(ok){
  try{if(navigator.vibrate)navigator.vibrate(ok?40:[60,40,60]);
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    const c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
    o.frequency.value=ok?880:260;g.gain.value=.08;o.start();o.stop(c.currentTime+(ok?.09:.25));setTimeout(()=>c.close(),400);
  }catch(e){}
}
let zxP=null;
function loadZX(){
  if(window.ZXing)return Promise.resolve();
  if(!zxP)zxP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="zxing.min.js";s.onload=res;s.onerror=()=>{zxP=null;rej(new Error("zx"))};document.head.appendChild(s)});
  return zxP;
}
function zxHints(){
  const H=new Map(),F=ZXing.BarcodeFormat;
  H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.CODE_128,F.QR_CODE,F.CODE_39,F.DATA_MATRIX,F.ITF]);
  H.set(ZXing.DecodeHintType.TRY_HARDER,true);
  return H;
}
const camHTML=id=>'<div class="camwrap" id="'+id+'w" hidden><video id="'+id+'" playsinline muted autoplay></video><div class="camtap" id="'+id+'tap"></div><div class="guide"></div><div class="camtip">Fit the front label in the box, then tap to read the cert and card name.</div><button type="button" class="shutter" id="'+id+'snap" aria-label="Scan"></button></div>';
async function startCamera(video,onCode,quiet){
  stopCamera();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){if(!quiet)toast("Camera needs the app opened over https");return false}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false})}
  catch(e){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})}catch(e2){if(!quiet)toast("Could not start the camera. Allow camera access in Settings and try again.");return false}}
  video.setAttribute("playsinline","");video.muted=true;video.srcObject=stream;
  try{await video.play()}catch(e){}
  try{const tr=stream.getVideoTracks()[0],cap=tr.getCapabilities&&tr.getCapabilities();if(cap&&cap.focusMode&&cap.focusMode.includes("continuous"))await tr.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
  let last="",lastT=0,on=true,n=0;
  const emit=t=>{const c=normalizeCert(t);if(!/^\d{5,10}$/.test(c))return;const now=Date.now();if(c===last&&now-lastT<2500)return;last=c;lastT=now;onCode(c)};
  if(!onCode){camStop=()=>{stream.getTracks().forEach(t=>t.stop());video.srcObject=null};return true}
  let det=null,reader=null;
  if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes("qr_code")||f.includes("code_128"))det=new BarcodeDetector({formats:["qr_code","code_128","code_39","data_matrix","itf"].filter(x=>f.includes(x))})}catch(e){}}
  if(!det){try{await loadZX();reader=new ZXing.MultiFormatReader();reader.setHints(zxHints())}catch(e){}}
  const cv=document.createElement("canvas"),ctx=cv.getContext("2d",{willReadFrequently:true});
  const tick=async()=>{
    if(!on)return;
    try{
      const W=video.videoWidth,H=video.videoHeight;
      if(video.readyState>=2&&W){
        if(det){const r=await det.detect(video);for(const x of r)emit(x.rawValue)}
        else if(reader){
          const m=n++%3,box=m===2?[0,0,W,H,1280]:[W*0.12,H*0.12,W*0.76,H*0.76,m===0?900:1400];
          const k=Math.min(1,box[4]/Math.max(box[2],box[3]));cv.width=Math.round(box[2]*k);cv.height=Math.round(box[3]*k);
          ctx.drawImage(video,box[0],box[1],box[2],box[3],0,0,cv.width,cv.height);
          try{emit(reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText())}catch(e){}
        }
      }
    }catch(e){}
    if(on)setTimeout(tick,160);
  };
  tick();
  camStop=()=>{on=false;stream.getTracks().forEach(t=>t.stop());video.srcObject=null};
  return true;
}
function captureFrame(video){
  return new Promise(res=>{
    const W=video.videoWidth,H=video.videoHeight;if(!W){res(null);return}
    const cv=document.createElement("canvas");cv.width=W;cv.height=H;cv.getContext("2d").drawImage(video,0,0,W,H);
    cv.toBlob(b=>res(b),"image/jpeg",0.92);
  });
}
function shutterFx(host){const d=document.createElement("div");d.className="shutterfx";host.appendChild(d);setTimeout(()=>d.remove(),350)}
async function snapAndRead(video,wrap){
  wrap.classList.add("busy");const b=await captureFrame(video);const c=b?await readBarcodeFromImage(b):null;wrap.classList.remove("busy");return c;
}
// read a PSA barcode or QR code from a still photo (the phone camera focuses much better than live video)
async function readBarcodeFromImage(file){
  let bmp;
  try{bmp=window.createImageBitmap?await createImageBitmap(file):await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}catch(e){return null}
  const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight;
  const good=t=>{const c=normalizeCert(t);return /^\d{5,10}$/.test(c)?c:null};
  if("BarcodeDetector" in window){
    try{const det=new BarcodeDetector();const r=await det.detect(bmp);for(const x of r){const c=good(x.rawValue);if(c)return c}}catch(e){}
  }
  try{await loadZX()}catch(e){return null}
  const reader=new ZXing.MultiFormatReader();reader.setHints(zxHints());
  const cv=document.createElement("canvas"),ctx=cv.getContext("2d",{willReadFrequently:true});
  const tryRegion=(sx,sy,sw,sh,scale)=>{
    cv.width=Math.max(1,Math.round(sw*scale));cv.height=Math.max(1,Math.round(sh*scale));
    ctx.drawImage(bmp,sx,sy,sw,sh,0,0,cv.width,cv.height);
    try{const src=new ZXing.HTMLCanvasElementLuminanceSource(cv);const r=reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src)));return good(r.getText())}catch(e){return null}
  };
  const pause=()=>new Promise(r=>setTimeout(r,0));
  for(const max of [1600,2400,1000]){const k=Math.min(1,max/Math.max(W,H));const c=tryRegion(0,0,W,H,k);if(c)return c;await pause()}
  // small barcode: scan overlapping close-up sections at full resolution
  for(const tile of [Math.round(Math.min(W,H)*0.45),Math.round(Math.min(W,H)*0.3)]){
    const step=Math.round(tile/2);
    for(let y=0;y<H;y+=step){for(let x=0;x<W;x+=step){
      const sw=Math.min(tile,W-x),sh=Math.min(tile,H-y);if(sw<tile/2||sh<tile/2)continue;
      const c=tryRegion(x,y,sw,sh,Math.min(1,1200/tile));if(c)return c;
    }await pause()}
  }
  return null;
}

let ocrW=null,ocrP=null;

const GRADE_WORDS=["GEM MT","GEM MINT","NM-MT","NM MT","EX-MT","VG-EX","MINT","AUTHENTIC","NM","EX","VG","GOOD","FAIR","POOR"];
const GRADE_NUM={"GEM MT":"10","GEM MINT":"10","NM-MT":"8","NM MT":"8","EX-MT":"6","VG-EX":"4","MINT":"9","NM":"7","EX":"5","VG":"3","GOOD":"2","FAIR":"1.5","POOR":"1"};
const YEAR_RE=/(^|\s)(19[89]\d|20[0-4]\d)(?=\s|$|-)/;
function parseLabel(raw){
  const lines=String(raw||"").split(/\n+/).map(l=>l.replace(/[^A-Za-z0-9#&'.\-\/ ]+/g," ").replace(/\s+/g," ").trim()).filter(l=>l.length>=2||/^\d$/.test(l));
  const all=lines.join(" "),U=all.toUpperCase();
  const certs=(all.match(/\b\d{7,10}\b/g)||[]).filter(x=>!/^(19|20)\d\d$/.test(x)).sort((a,b)=>b.length-a.length);
  const cert=certs[0]||"";
  let gw="",gn="";
  for(const w of GRADE_WORDS){const re=new RegExp("(^|\\s)"+w.replace(/[-\s]/g,"[-\\s]?")+"(?=\\s|$)(\\s+(10|[1-9](\\.5)?))?");const m=U.match(re);if(m&&!(w==="EX"&&/\bEX\b/.test(all)&&!/\bEX\s+(10|[1-9])\b/.test(U))){gw=w;gn=m[3]||"";break}}
  if(!gn){const solo=lines.filter(l=>/^(10|[1-9](\.5)?)$/.test(l));if(solo.length)gn=solo[solo.length-1];else if(gw){const m=lines.map(l=>l.match(/(?:^|\s)(10|[1-9](?:\.5)?)$/)).filter(Boolean);if(m.length)gn=m[m.length-1][1]}}
  // the grade word is printed bigger and reads more reliably than the number, so it wins
  if(gw&&GRADE_NUM[gw]){const want=GRADE_NUM[gw];if(gn!==want&&!(gw==="MINT"&&gn==="9.5"))gn=want}
  const nm=all.match(/#\s?([A-Za-z0-9][A-Za-z0-9\-\/]{0,7})/);const num=nm?nm[1]:"";
  // a PSA front label always starts with the year; no year means this is not the front label
  const start=lines.findIndex(l=>YEAR_RE.test(l));
  const desc=[];
  if(start>=0)lines.slice(start).some(l=>{
    let t=" "+l+" ";
    const hasCert=cert&&t.includes(" "+cert+" ");
    if(cert)t=t.replace(new RegExp("\\s"+cert+"(?=\\s)","g")," ");
    if(nm)t=t.replace(/#\s?[A-Za-z0-9][A-Za-z0-9\-\/]{0,7}/g," ");
    if(gw)t=t.replace(new RegExp("\\s"+gw.replace(/[-\s]/g,"[-\\s]?")+"(?=\\s)","ig")," ");
    if(gn)t=t.replace(new RegExp("\\s"+gn.replace(".","\\.")+"\\s*$")," ");
    if(!desc.length){const m=t.match(YEAR_RE);if(m)t=" "+t.slice(m.index+m[1].length)}
    if(/^\s*\d{1,2}(\.5)?\s*$/.test(t))t="";
    t=t.replace(/\s+/g," ").trim();
    const letters=(t.match(/[A-Za-z]/g)||[]).length;
    if(letters>=3&&letters/t.replace(/\s/g,"").length>0.5)desc.push(t);
    return (hasCert&&desc.length>=3)||desc.length>=4;
  });
  let d=psaCase(desc.join(" "));
  if(!/[A-Za-z]{3}/.test(d.replace(YEAR_RE,"")))d="";
  if(d&&num)d+=" #"+num;
  if(d&&gn)d+=" PSA "+gn;else if(d&&gw==="AUTHENTIC")d+=" PSA Authentic";
  return{cert,desc:d,grade:gn,num,raw:all};
}
async function ocrCanvas(cv){
  const w=await ocrReady();
  const r=await w.recognize(cv,{},{blocks:true,text:true});
  const d=r&&r.data||{};
  // keep only words the reader is sure about; glare, plastic and artwork come back as low-confidence junk
  if(d.blocks&&d.blocks.length){
    const out=[];d.blocks.forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>{const t=(l.words||[]).filter(x=>x.confidence>=65).map(x=>x.text).join(" ");if(t)out.push(t)})));
    return parseLabel(out.join("\n"));
  }
  return parseLabel(d.text||"");
}
// crop the scan box out of a live video frame, scaled up so small label text reads well
function guideCanvas(video,guide){
  const vr=video.getBoundingClientRect(),gr=guide.getBoundingClientRect(),vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vr.width)return null;
  const k=Math.max(vr.width/vw,vr.height/vh),ox=(vr.width-vw*k)/2,oy=(vr.height-vh*k)/2;
  const pad=0.08;let x=(gr.left-vr.left-ox)/k,y=(gr.top-vr.top-oy)/k,w=gr.width/k,h=gr.height/k;
  x-=w*pad;y-=h*pad;w*=1+2*pad;h*=1+2*pad;x=Math.max(0,x);y=Math.max(0,y);w=Math.min(vw-x,w);h=Math.min(vh-y,h);
  const sc=Math.min(2.5,Math.max(1,1600/w)),cv=document.createElement("canvas");cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);

  return cv;
}
async function imageCanvas(blob,max){

const PSA_UP=new Set(["GX","EX","V","VMAX","VSTAR","IR","SIR","SAR","AR","UR","HR","CHR","TG","GG","PSA","SV","SWSH","XY","SM","BW","DX","CS","CBB","JP","EN","PR","LV.X","TAG","TEAM","BREAK","PRIME","MEGA"].map(x=>x.toUpperCase()));
function psaCase(str){
  return String(str||"").trim().split(/\s+/).map(w=>w.split("-").map(p=>{
    if(!p)return p;if(p===p.toLowerCase())return p;if(/^\d+(ST|ND|RD|TH)$/i.test(p))return p.toLowerCase();if(/\d/.test(p))return p;if((p.match(/\./g)||[]).length>=2&&p.length<=6&&p===p.toUpperCase())return p;
    if(PSA_UP.has(p.toUpperCase())&&p.toUpperCase()!=="MEGA")return p.toUpperCase();return p.charAt(0).toUpperCase()+p.slice(1).toLowerCase();
  }).join("-")).join(" ");
}
function psaTitle(i){
  if(!i)return "";
  const gr=String(i.CardGrade||i.GradeDescription||"").trim(),m=gr.match(/(\d+(?:\.\d)?)\s*$/);
  const g=m?"PSA "+m[1]:(gr?"PSA "+psaCase(gr):"");
  const brand=psaCase(i.Brand),subj=psaCase(i.Subject),vari=psaCase(i.Variety);
  return [i.Year,brand,subj,vari,i.CardNumber?"#"+String(i.CardNumber).replace(/^#/,""):"",g].map(x=>String(x||"").trim()).filter(Boolean).join(" ");
}
function b64Blob(b64,type){const bin=atob(b64),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:type||"image/jpeg"})}
async function psaLookup(cert,images){
  let r;
  try{r=await sb.functions.invoke("psa-lookup",{body:{cert,images:images!==false}})}catch(e){return{error:errText(e)}}
  if(r&&r.error){
    const st=r.error.context&&r.error.context.status,m=String(r.error.message||"");
    if(st===404||/Failed to send|not found|FunctionsFetchError|FunctionsRelayError/i.test(m+" "+(r.error.name||"")))return{error:"PSA lookup is not set up yet. See the PSA section in SETUP.md.",setup:true};

}
function psaParse(d){

function rowRepack(st,approved,hasCols){
  st=String(st||"").toLowerCase();approved=String(approved||"").trim().toLowerCase();
  if(/reject|declin|denied/.test(st))return "rejected";
  if(/pend|review|waiting/.test(st))return "pending";
  if(/accept|approv|sold|took|taken/.test(st)||approved==="yes")return "accepted";
  if(approved==="no")return "pending";
  return hasCols?"":"accepted";
}
async function importTriumphStatus(text){
  const rows=parseCSV(text);if(rows.length<2){toast("That file looks empty");return}
  const H=rows[0].map(h=>h.trim().toLowerCase()),g=(r,i)=>i>=0&&i<r.length?r[i]:"";
  const ix=(...k)=>H.findIndex(h=>k.some(x=>h===x))>=0?H.findIndex(h=>k.some(x=>h===x)):H.findIndex(h=>k.some(x=>h.includes(x)));
  const iC=ix("cert id","psa cert #","cert"),iS=ix("status"),iCS=H.indexOf("card status"),iA=H.indexOf("approved"),iM=ix("market value"),iR=ix("rate","consignor %"),iT=ix("card title","item description","description");
  if(iC<0){toast("Could not find a cert column in that file");return}
  const hasCols=iS>=0||iCS>=0||iA>=0;
  const byCert=new Map(state.week.cards.filter(c=>c.cert&&!c.sold).map(c=>[c.cert,c]));
  const seen=new Set(),changes=[],missing=[];let same=0,soldAlready=0;
  rows.slice(1).forEach(r=>{
    const cert=normalizeCert(g(r,iC));if(!cert||seen.has(cert))return;seen.add(cert);
    const st=rowRepack(g(r,iS)+" "+g(r,iCS),g(r,iA),hasCols);if(!st)return;
    const mv=iM>=0&&g(r,iM).trim()!==""?parseMoney(g(r,iM)):null,pct=iR>=0&&g(r,iR).trim()!==""?parseMoney(g(r,iR)):null;
    const c=byCert.get(cert);
    if(!c){if(state.week.cards.some(x=>x.cert===cert&&x.sold))soldAlready++;else missing.push({cert,st,mv,pct,desc:iT>=0?g(r,iT).trim():""});return}
    const patch={};
    const who=ui.importRepacker||state.settings.repackers[0];
    if(c.repack!==st||(state.hasRepacker&&c.repacker!==who)){patch.repack_status=st;patch.repack_date=todayISO();if(state.hasRepacker)patch.repacker=who}
    if(mv!=null&&round2(+c.mv||0)!==round2(mv))patch.market_value=mv;
    if(pct!=null&&(+c.pct||0)!==pct)patch.consignor_pct=pct;
    if(c.notes===PENDING_NOTE)patch.notes="";
    if(Object.keys(patch).length)changes.push({c,patch,st});else same++;
  });
  const cnt=k=>changes.filter(x=>x.patch.repack_status===k).length;
  const rpn=ui.importRepacker||state.settings.repackers[0];
  const el=modal('<h2>What '+esc(rpn)+' accepted</h2><div class="counts"><div><b>'+cnt("accepted")+'</b><span>newly accepted</span></div><div><b>'+cnt("pending")+'</b><span>pending</span></div><div><b>'+cnt("rejected")+'</b><span>rejected</span></div></div><p class="hint">'+(changes.length?changes.length+" card"+(changes.length>1?"s":"")+" in this week will be updated"+(changes.some(x=>x.patch.market_value!=null||x.patch.consignor_pct!=null)?" (some also get the repacker's market value or rate)":"")+".":"No changes needed.")+(same?" "+same+" already up to date.":"")+(soldAlready?" "+soldAlready+" already sold to customers, left alone.":"")+"</p>"+
    (missing.length?'<label class="chk"><input type="checkbox" id="tiadd">Also add the '+missing.length+" cert"+(missing.length>1?"s":"")+" not in this week</label>":"")+
    '<div class="actions"><button class="btn" id="tigo" type="button"'+(changes.length||missing.length?"":" disabled")+'>Update</button><button class="btn sec" data-act="close-modal" type="button">Cancel</button></div>');
  $("#tigo",el).addEventListener("click",async()=>{
    el.querySelectorAll("button").forEach(b=>b.disabled=true);$("#tigo",el).textContent="Updating...";
    let ok=0;
    for(let k=0;k<changes.length;k+=8){const rs=await Promise.all(changes.slice(k,k+8).map(x=>api(sb.from("cards").update(x.patch).eq("id",x.c.id))));ok+=rs.filter(Boolean).length}
    let added=0;
    if(missing.length&&$("#tiadd",el)&&$("#tiadd",el).checked){
      const rowsNew=missing.map(m=>newCardRow({cert:m.cert,desc:m.desc,mv:m.mv==null?"":m.mv,pct:m.pct==null?state.settings.defaultPct:m.pct,repack:m.st,repackDate:todayISO(),repacker:rpn}));

const PENDING_NOTE="Pending Triumph approval";
async function importCSVText(text){
  const rows=parseCSV(text);if(rows.length<2){toast("That file looks empty");return}
  const H=rows[0].map(h=>h.trim().toLowerCase());
  const g=(r,i)=>i>=0&&i<r.length?r[i]:"";
  const owners=["Shared",...state.settings.partners];
  const pickOwner=v=>owners.find(o=>o.toLowerCase()===String(v||"").trim().toLowerCase())||"Shared";
  const byCert=new Map(state.week.cards.filter(c=>c.cert).map(c=>[c.cert,c]));

  if(H.includes("cert id")&&H.includes("card title")){
    // repacker export (Triumph format)
    const rpFrom=ui.importMode==="new"&&ui.importRepacker!==undefined?ui.importRepacker:"Triumph";
    const X=n=>H.indexOf(n);
    const iT=X("card title"),iC=X("cert id"),iG=X("grade"),iCo=X("grading company"),iM=X("market value"),iR=X("rate"),iO=X("owner"),iS=X("status"),iCS=X("card status"),iA=X("approved");
    const seen=new Set(),items=[];let rejected=0;
    rows.slice(1).forEach(r=>{
      const cert=g(r,iC).trim(),title=g(r,iT).trim();
      if(!cert&&!title)return;
      if(cert&&seen.has(cert))return;if(cert)seen.add(cert);
      const st=(g(r,iS)+" "+g(r,iCS)).toLowerCase();
      if(/reject/.test(st)){rejected++;return}
      const co=g(r,iCo).trim(),gr=g(r,iG).trim();
      const tag=co&&gr?co+" "+gr:"";
      const desc=title+(tag&&!title.toUpperCase().includes(tag.toUpperCase())?" "+tag:"");
      const pending=/pending/.test(st)||/^no$/i.test(g(r,iA).trim());
      items.push({cert,desc,mv:parseMoney(g(r,iM)),pct:g(r,iR)!==""?parseMoney(g(r,iR)):state.settings.defaultPct,owner:pickOwner(g(r,iO)),pending,repack:!rpFrom?"":pending?"pending":/accept|approv/.test(st)?"accepted":""});
    });
    const fresh=items.filter(i=>!i.cert||!byCert.has(i.cert));
    const upd=items.filter(i=>{const c=i.cert&&byCert.get(i.cert);return c&&(round2(+c.mv||0)!==round2(i.mv)||(+c.pct||0)!==i.pct||(c.notes===PENDING_NOTE&&!i.pending)||(state.hasRepack&&!c.sold&&i.repack&&(c.repack!==i.repack||c.repacker!==rpFrom)))});
    const pendNew=fresh.filter(i=>i.pending).length;
    let incl=true;
    if(pendNew&&!confirm(pendNew+" new cards are still pending approval"+(rpFrom?" at "+rpFrom:"")+". Include them? OK = include"+(rpFrom?" (marked Pending at "+rpFrom+")":"")+", Cancel = skip them."))incl=false;
    const add=fresh.filter(i=>incl||!i.pending);
    if(!add.length&&!upd.length){toast("Nothing new. Everything in this file is already here.");return}
    if(!confirm("Import: "+add.length+" new cards"+(upd.length?", "+upd.length+" existing cards get updated market value or rate":"")+(rejected?" ("+rejected+" rejected rows ignored)":"")+". Continue?"))return;
    toast("Importing...");
    const rowsNew=add.map(i=>newCardRow({cert:i.cert,desc:i.desc,mv:i.mv,pct:i.pct,owner:i.owner,repack:state.hasRepack?i.repack:"",repacker:i.repack?rpFrom:"",notes:i.pending&&!state.hasRepack?PENDING_NOTE:""}));
    for(let k=0;k<rowsNew.length;k+=300){
      if(!await api(sb.from("cards").upsert(rowsNew.slice(k,k+300),{onConflict:"week_id,cert",ignoreDuplicates:true})))return;
    }
    for(const i of upd){
      const c=byCert.get(i.cert);
      const patch={market_value:i.mv,consignor_pct:i.pct};
      if(c.notes===PENDING_NOTE&&(!i.pending||state.hasRepack))patch.notes="";
      if(state.hasRepack&&!c.sold&&i.repack&&(c.repack!==i.repack||c.repacker!==rpFrom)){patch.repack_status=i.repack;patch.repack_date=todayISO();if(state.hasRepacker)patch.repacker=rpFrom}
      if(!await api(sb.from("cards").update(patch).eq("id",c.id)))break;
    }
    await refreshRender();toast(add.length+" added"+(upd.length?", "+upd.length+" updated":""));
    return;
  }

  // generic CSV (this app's own exports and similar)
  const ix=(...k)=>H.findIndex(h=>k.some(x=>h.includes(x)));
  const I={date:ix("date purchased","date"),cert:ix("cert"),desc:ix("description","item","title"),owner:ix("owner"),mv:ix("market value","market"),pct:ix("%","rate"),status:ix("status"),sp:ix("sold price"),sd:ix("sold date"),notes:ix("note")};
  if(I.cert<0&&I.desc<0){toast("Could not find Cert or Description columns");return}
  const have=new Set(byCert.keys());
  const out=[];let skipped=0;
  rows.slice(1).forEach(r=>{
    const cert=g(r,I.cert).trim(),desc=g(r,I.desc).trim();
    if(!cert&&!desc)return;
    if(cert&&have.has(cert)){skipped++;return}
    if(cert)have.add(cert);
    const pct=I.pct>=0&&g(r,I.pct)!==""?parseMoney(g(r,I.pct)):state.settings.defaultPct;
    const sold=/sold|traded/i.test(g(r,I.status));
    out.push(newCardRow({date:parseDate(g(r,I.date))||todayISO(),cert,desc,owner:pickOwner(g(r,I.owner)),mv:g(r,I.mv)===""?"":parseMoney(g(r,I.mv)),pct,sold,soldPrice:sold&&g(r,I.sp)!==""?parseMoney(g(r,I.sp)):"",soldDate:parseDate(g(r,I.sd)),notes:g(r,I.notes).trim()}));
  });
  if(!out.length){toast(skipped?"All "+skipped+" rows were already here":"No cards found");return}
  if(!confirm("Import "+out.length+" cards"+(skipped?" ("+skipped+" duplicates skipped)":"")+"?"))return;
  for(let i=0;i<out.length;i+=300){
    if(!await api(sb.from("cards").upsert(out.slice(i,i+300),{onConflict:"week_id,cert",ignoreDuplicates:true})))return;
  }
  await refreshRender();toast(out.length+" cards imported");
}

    if(!mk||!bar){render();return}
    row.classList.toggle("picked",on);mk.classList.toggle("on",on);mk.innerHTML=on?ic("check",15):"";
    const tmp=document.createElement("div");tmp.innerHTML=selBar();bar.innerHTML=tmp.firstChild.innerHTML},
  "sel-all"(){filteredCards().forEach(c=>ui.sel.add(c.id));render()},
  "sel-del"(){bulkDeleteModal()},
  who(){whoModal()},
  "psa-fill"(){psaFillModal()},
  back(){ui.hist=null;render()},
  filter(id){ui.filter=id;render()},
  "add-card"(){cardModal(null)},
  "edit-card"(id){cardModal(id)},
  "view-card"(id){viewCardModal(id)},
  bulk(){bulkModal()},
  "scan-certs"(){scanModal()},
  "import-csv"(){importChooser()},
  "sel-repack"(){repackBulkModal()},
  "add-entry"(id,t){entryModal(t.dataset.kind,null)},
  "edit-entry"(id,t){entryModal(t.dataset.kind,id)},
  "close-week"(){closeWeekModal()},
  settings(){settingsModal()},
  "close-modal"(){closeModal()},
  "open-hist"(id){ui.hist=id;ui.top=true;render()},
  "del-hist"(id){deleteWeekModal(id)},
  "week-menu"(id){weekMenu(id)},
  "rename-week"(id){renameWeekModal(id)},
  exp(id,t){doExport(t.dataset.kind,id)},
  "exp-all"(id,t){doExportAll(t.dataset.kind)},
  "exp-audit"(){exportAudit()},
  "act-user"(id){ui.actUser=id||"";render()},
  "act-scope"(id){ui.actScope=id;ui.top=true;render()},
  backup(){backup()},
  "change-pw"(){passwordModal()},
  async "sign-out"(){closeModal();ui.denied="";try{await sb.auth.signOut()}catch(e){}teardown();render()},
  async forgot(){
    const f=$("#lf"),email=f&&f.email.value.trim();
    if(!email){toast("Type your email first, then tap Forgot password");return}
    const r=await api(sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}));
    if(r)toast("If that email is on the list, a reset link is on its way");
  }
};
let lp=null,lpSuppress=false;
document.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  const r=e.target.closest('[data-act="edit-card"]');if(!r||ui.sel||ui.hist)return;
  clearTimeout(lp&&lp.t);
  lp={id:r.dataset.id,x:e.clientX,y:e.clientY,t:setTimeout(()=>{const id=lp&&lp.id;lp=null;if(id)startQuickSelect(id)},450)};
});
document.addEventListener("pointermove",e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10){clearTimeout(lp.t);lp=null}});
["pointerup","pointercancel","scroll"].forEach(n=>document.addEventListener(n,()=>{if(lp){clearTimeout(lp.t);lp=null}},true));
document.addEventListener("contextmenu",e=>{if(e.target.closest(".row"))e.preventDefault()});
function startQuickSelect(id){
  const c=state&&state.week.cards.find(x=>x.id===id);if(!c)return;
  ui.sel=new Set([id]);lpSuppress=true;setTimeout(()=>{lpSuppress=false},900);
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  render();
}
document.addEventListener("click",e=>{if(lpSuppress&&e.target.closest("[data-act]")){lpSuppress=false;e.preventDefault();return}const t=e.target.closest("[data-act]");if(!t)return;const fn=actions[t.dataset.act];if(fn){e.preventDefault();fn(t.dataset.id,t,e)}});
document.addEventListener("input",e=>{if(e.target.id==="q"){ui.q=e.target.value;paintList()}});
document.addEventListener("change",e=>{const id=e.target.id;if(id==="sortsel"){ui.sort=e.target.value;try{localStorage.setItem("repack-ui",JSON.stringify({sort:ui.sort}))}catch(x){}render()}else if(id==="ownersel"){ui.owner=e.target.value;render()}});
$("#csvin").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const mode=ui.importMode;const r=new FileReader();r.onload=()=>mode==="triumph"?importTriumphStatus(String(r.result)):importCSVText(String(r.result));r.readAsText(f)});
document.addEventListener("visibilitychange",()=>{if(!sb||!me)return;if(document.hidden){try{pc&&pc.untrack()}catch(e){}lastTrack=""}else{softRefresh();if(pcStatus!=="SUBSCRIBED"||rtStatus!=="SUBSCRIBED")retryLive();trackMe(true)}});
window.addEventListener("online",()=>{if(sb&&me)softRefresh()});

// ---------- full-screen height (iPhone home screen apps report a short height) ----------
// when the iPhone keyboard is up, fit open forms into the visible area and keep the box being typed in on screen
function applyKeyboard(vh,vt){
  const de=document.documentElement,kb=Math.max(0,window.innerHeight-vh-vt);
  if(kb>80){de.classList.add("kbopen");de.style.setProperty("--vvh",vh+"px");de.style.setProperty("--vvt",vt+"px")}
  else de.classList.remove("kbopen");
  return kb>80;
}
function keepFieldVisible(){
  const a=document.activeElement;if(!a||!a.closest)return;
  const sh=a.closest(".sheet");if(!sh||sh.classList.contains("fullscan")||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  const r=a.getBoundingClientRect(),sr=sh.getBoundingClientRect(),pad=70;
  if(r.bottom>sr.bottom-pad||r.top<sr.top+20)sh.scrollTop+=r.top-sr.top-sr.height/3;
}
if(window.visualViewport){
  const vv=window.visualViewport;let kt;
  const onVV=()=>{const open=applyKeyboard(vv.height,vv.offsetTop);if(open){clearTimeout(kt);kt=setTimeout(keepFieldVisible,60)}};
  vv.addEventListener("resize",onVV);vv.addEventListener("scroll",onVV);
  document.addEventListener("focusin",()=>{setTimeout(()=>{onVV();keepFieldVisible()},320)});
}
function fitShell(){
  let h=window.innerHeight;
  const mm=q=>!!(window.matchMedia&&window.matchMedia(q).matches);
  if(navigator.standalone===true||mm("(display-mode: standalone)")&&/iPhone|iPad|iPod/.test(navigator.userAgent)){
    const port=window.matchMedia?mm("(orientation: portrait)"):innerHeight>=innerWidth;
    const full=port?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
    if(full>h&&full-h<=90)h=full;
  }
  document.documentElement.style.setProperty("--apph",h+"px");
}
fitShell();
window.addEventListener("resize",fitShell);
window.addEventListener("scroll",()=>{if(document.body.classList.contains("shell")&&(window.scrollY||window.pageYOffset))window.scrollTo(0,0)},{passive:true});
window.addEventListener("orientationchange",()=>{setTimeout(fitShell,250);setTimeout(fitShell,700)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)fitShell()});

// ---------- boot ----------
async function boot(){
  const c=cfg();
  if(!c||!window.supabase){render();return}
  sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(ev=>{
    if(ev==="PASSWORD_RECOVERY"){ui.recovery=true;setTimeout(render,0)}
    if(ev==="SIGNED_OUT"&&me){teardown();setTimeout(render,0)}
  });
  let session=null;
  try{const r=await sb.auth.getSession();session=r.data&&r.data.session}catch(e){}
  if(ui.recovery){render();return}
  if(session)await enter(session);else render();
}
boot();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
